<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whistle Tab</title>
<script>try{if(localStorage.getItem('pw-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/abcjs-basic-min.js"></script>
</head>
<body class="has-player">
<div id="top">
  <div class="player" role="region" aria-label="Player">
    <div class="controls">
      <button class="btn" id="play" type="button">▶ Play</button>
      <button class="btn mute-toggle" type="button" aria-pressed="false" aria-label="Mute"></button>
      <button class="btn settings-toggle" type="button" aria-expanded="false" aria-label="Player settings">⚙</button>
      <div class="settings">
        <label for="tempo">Tempo</label><input type="range" id="tempo" min="30" max="220" value="90"><span id="tempo-v" class="small">90</span>
        <label for="instrument">Instrument</label><select id="instrument"></select>
        <span id="style" class="small"></span>
        <label class="small check"><input type="checkbox" id="guitar"> Guitar chords</label>
        <label class="small check"><input type="checkbox" id="sound" checked> Sound on click</label>
        <button class="btn mp3" type="button" title="The tune as Play sounds it: this tempo and instrument, with guitar chords if they are on">⬇ MP3</button>
      </div>
    </div>
    <div class="now" id="now"></div>
  </div>
</div>
<main>
  <div class="tune-head">
    <div>
      <h1 id="title">Loading…</h1>
      <div id="meta" class="badges"></div>
    </div>
    <div class="actions">
      <button class="btn" id="toggle-original" aria-pressed="false" hidden>Show original</button>
      <button class="btn primary" id="pdf" type="button"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span><span class="wide-only">Download </span>PDF</span></button>
      <a class="btn" id="edit" href="#">Edit</a>
      <details class="more">
        <summary class="btn" aria-label="More actions">⋯ More</summary>
        <div class="menu">
          <button class="btn mp3" type="button" title="The tune as Play sounds it: the current tempo and instrument, with guitar chords if they are on">Download MP3</button>
          <a class="btn" id="json" href="#" download>Download JSON</a>
          <button class="btn" id="print" type="button">Print</button>
          <button class="btn danger" id="delete" type="button">Delete</button>
        </div>
      </details>
    </div>
  </div>

  <div class="split" id="split">
    <aside class="original-pane" id="original" hidden aria-label="Original music"></aside>
    <div class="tab-pane">
      <div id="tab"></div>
      <p class="muted small no-print">Tip: tap any note in the music or the tab to see its fingering.<span class="kbd-tip"> Use ← → to step through the notes.</span></p>
    </div>
  </div>

  <section class="card stack" style="margin-top:16px">
    <h2>Guitar chords in this tune</h2>
    <div id="chords" class="chord-list"></div>
  </section>
</main>

<script type="module">
import { buildDisplayAbc } from './js/core.js';
import { TabView, Player, tone, defaultBpm } from './js/render.js';
import { renderPages, showPages } from './js/originals.js';
import { $, api, esc, topbar, renderNow, renderChordList, originalSources, tabStyleControl, instrumentControl, errorHTML, loginUrl, tuneRoute, isMuted, licenseBadge, checkLicense, showLicenseDialog } from './js/ui.js';

$('#top').insertAdjacentHTML('afterbegin', topbar());
const params = new URLSearchParams(location.search);
const id = params.get('id');
const owner = params.get('owner'); // set for a friend's tune, which is read-only

const view = new TabView($('#tab'), {
  onSelect: (item, i, ctx) => {
    renderNow($('#now'), item, ctx);
    if (ctx.source !== 'play' && item.type === 'note' && $('#sound').checked) tone(item.midi, undefined, Math.min(0.7, 0.3 + item.beats * 0.12));
  },
});
const player = new Player(view, { onStop: () => { $('#play').textContent = '▶ Play'; } });
renderNow($('#now'), null);

let tune, displayAbc, pagesLoaded = false, canCheck = false;

// The license status under the title: click it for the details in a pop-up. For whoever may run checks, unchecked tunes get a Check button.
function renderLicense({ checking = false } = {}) {
  const el = $('#license-slot');
  if (!el) return;
  if (checking) el.innerHTML = '<span class="lic-checking muted small"><span class="spinner" aria-hidden="true"></span>Checking license…</span>';
  else if (tune.license) el.innerHTML = licenseBadge(tune.license, { button: true });
  else if (canCheck) el.innerHTML = '<button class="btn compact" id="check-license" type="button" title="Look up who owns the rights to this tune and whether it can be used for free in a game or video">Check license</button>';
  else el.innerHTML = '<span class="badge">License unknown</span>';
}

async function runLicenseCheck() {
  renderLicense({ checking: true });
  try {
    tune.license = await checkLicense(tune.id, owner);
  } catch (e) {
    if (e.signIn) location.href = loginUrl();
    else alert('Could not check the license: ' + e.message);
  } finally {
    renderLicense();
  }
}
$('#meta').addEventListener('click', (e) => {
  if (e.target.closest('#check-license')) runLicenseCheck();
  if (e.target.closest('.show-license')) {
    const onCheck = canCheck ? async () => { tune.license = await checkLicense(tune.id, owner); renderLicense(); return tune.license; } : undefined;
    showLicenseDialog(tune.title, tune.license, { onCheck });
  }
});

async function setOriginal(show) {
  const btn = $('#toggle-original');
  btn.setAttribute('aria-pressed', String(show));
  btn.textContent = show ? 'Hide original' : 'Show original';
  $('#original').hidden = !show;
  $('#split').classList.toggle('with-original', show);
  if (show && !pagesLoaded) {
    pagesLoaded = true;
    $('#original').innerHTML = '<p class="muted">Loading original…</p>';
    try { showPages($('#original'), await renderPages(originalSources(tune))); }
    catch (e) { $('#original').innerHTML = `<p>${errorHTML(e, 'Could not load the original')}</p>`; }
  }
  view.render(displayAbc);
}

try {
  tune = await api(tuneRoute(id, owner));
  document.title = tune.title;
  $('#title').textContent = tune.title;
  const t = tune.tab || {};
  $('#meta').innerHTML = [
    tune.owner && `<span class="badge accent">From ${esc(tune.owner.name || tune.owner.email)}’s library</span>`,
    tune.composer && `<span class="badge">${esc(tune.composer)}</span>`,
    t.key && `<span class="badge accent">Key ${esc(t.key)}</span>`,
    t.meter && `<span class="badge">${esc(t.meter)}</span>`,
    tune.settings?.transpose ? `<span class="badge">transposed ${tune.settings.transpose > 0 ? '+' : ''}${tune.settings.transpose} from the original</span>` : '',
    `<span class="badge">approved ${new Date(tune.updatedAt).toLocaleDateString()}</span>`,
  ].filter(Boolean).join('');
  $('#meta').insertAdjacentHTML('beforeend', '<span id="license-slot" aria-live="polite"></span>');
  canCheck = !!(await api('config').catch(() => ({}))).licenseCheck;
  renderLicense();
  $('#edit').href = `editor.html?id=${encodeURIComponent(tune.id)}`;
  if (tune.owner) $('#edit').hidden = $('#delete').hidden = true;
  $('#json').href = URL.createObjectURL(new Blob([JSON.stringify(tune, null, 2)], { type: 'application/json' }));
  $('#json').download = `${tune.id}.json`;

  displayAbc = tune.displayAbc || buildDisplayAbc(tune.abc, tune.settings || {}).abc;
  view.render(displayAbc);
  renderChordList($('#chords'), t.chordsUsed || []);
  tabStyleControl($('#style'), () => view.render(displayAbc));
  $('#pdf').addEventListener('click', async () => {
    const btn = $('#pdf');
    btn.disabled = true;
    const label = btn.innerHTML;
    btn.textContent = 'Making PDF…';
    try {
      const { downloadPdf } = await import('./js/pdf.js');
      await downloadPdf({
        displayAbc, title: tune.title, composer: tune.composer, key: t.key, meter: t.meter,
        chords: t.chordsUsed || [], filename: `${tune.id}-whistle-tab.pdf`,
      });
    } catch (e) {
      alert('Could not make the PDF: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = label;
    }
  });
  // in the player settings and the More menu
  document.querySelectorAll('.mp3').forEach((btn) => btn.addEventListener('click', async () => {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Making MP3…';
    try {
      const bpm = Number($('#tempo').value), chords = $('#guitar').checked, inst = $('#instrument').value;
      const { downloadMp3 } = await import('./js/mp3.js');
      const sound = inst === 'pennywhistle' ? '' : `-${inst.replace(/_/g, '-')}`;
      await downloadMp3(view, bpm, { chords, filename: `${tune.id}-${bpm}bpm${sound}${chords ? '-guitar' : ''}.mp3` });
    } catch (e) {
      alert('Could not make the MP3: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = label;
      const more = btn.closest('details');
      if (more) more.open = false;
    }
  }));
  $('#tempo').value = defaultBpm(view.visual);
  $('#tempo-v').textContent = $('#tempo').value;

  if (tune.originals?.length) {
    $('#toggle-original').hidden = false;
    $('#toggle-original').addEventListener('click', () => setOriginal($('#original').hidden));
  }
} catch (e) {
  $('#title').textContent = e.signIn ? 'Sign in needed' : 'Tune not found';
  $('#tab').innerHTML = `<p>${errorHTML(e)}</p>${e.signIn ? '' : '<p><a href="./">Back to the library</a></p>'}`;
  document.querySelectorAll('.actions .btn, .player').forEach((b) => (b.hidden = true));
}

$('#tempo').addEventListener('input', () => { $('#tempo-v').textContent = $('#tempo').value; });
function startPlay() {
  player.play(Number($('#tempo').value), view.selected, { muted: isMuted(), chords: $('#guitar').checked });
  $('#play').textContent = '■ Stop';
}
$('#play').addEventListener('click', () => (player.playing ? player.stop() : startPlay()));
document.addEventListener('pw-mute', () => { if (player.playing) startPlay(); }); // carry on from the current note
$('#guitar').addEventListener('change', () => { if (player.playing) startPlay(); });
instrumentControl($('#instrument'), () => { if (player.playing) startPlay(); });
$('#print').addEventListener('click', () => window.print());
$('#delete').addEventListener('click', async () => {
  if (!confirm(`Delete “${tune.title}” and its original files from the library?`)) return;
  try {
    await api(`tunes/${tune.id}/delete`, { method: 'POST' });
    location.href = './';
  } catch (e) {
    if (e.signIn) location.href = loginUrl(); // nothing unsaved on this page
    else alert('Could not delete: ' + e.message);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight') { view.step(1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { view.step(-1); e.preventDefault(); }
  if (e.key === ' ') { $('#play').click(); e.preventDefault(); }
});
// Re-lay out only when the width changes (phones fire resize as the address bar slides).
let rt, lastWidth = $('#tab').clientWidth;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const w = $('#tab').clientWidth;
    if (w !== lastWidth && displayAbc) { lastWidth = w; view.render(displayAbc); }
  }, 250);
});
</script>
</body>
</html>
