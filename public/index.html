<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny Whistle Tabs</title>
<script>try{if(localStorage.getItem('pw-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="top"></div>
<main>
  <div class="lib-head">
    <div>
      <h1>Tune library</h1>
      <p class="muted" style="margin:0">Approved penny whistle (D) tabs, saved on this server.</p>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="Search title, key, chord…" aria-label="Search tunes">
      <a class="btn primary" href="editor.html">+ New tab from sheet music</a>
    </div>
  </div>
  <div id="list" class="tune-grid" aria-live="polite"></div>
  <div id="empty" class="card empty" hidden>
    <h2>No tunes yet</h2>
    <p class="muted">Upload a PDF or photo of sheet music and Claude will turn it into penny whistle tab with guitar chords.</p>
    <a class="btn primary" href="editor.html">Create your first tab</a>
  </div>
</main>
<script type="module">
import { $, api, esc, topbar } from './js/ui.js';
$('#top').innerHTML = topbar('library');
let tunes = [];
function draw() {
  const q = $('#q').value.trim().toLowerCase();
  const shown = tunes.filter((t) => !q || [t.title, t.composer, t.key, t.meter, ...(t.chords || [])].join(' ').toLowerCase().includes(q));
  $('#empty').hidden = tunes.length > 0;
  $('#list').innerHTML = shown.map((t) => `
    <a class="tune-card" href="tune.html?id=${encodeURIComponent(t.id)}">
      <h3>${esc(t.title)}</h3>
      ${t.composer ? `<div class="muted small">${esc(t.composer)}</div>` : ''}
      <div class="badges">
        ${t.key ? `<span class="badge accent">Key ${esc(t.key)}</span>` : ''}
        ${t.meter ? `<span class="badge">${esc(t.meter)}</span>` : ''}
        <span class="badge">${t.measures} bars</span>
        ${t.transpose ? `<span class="badge">transposed ${t.transpose > 0 ? '+' : ''}${t.transpose}</span>` : ''}
        ${t.hasOriginal ? '<span class="badge">original attached</span>' : ''}
      </div>
      ${t.chords?.length ? `<div class="muted small" style="margin-top:8px">Chords: ${t.chords.map(esc).join(' · ')}</div>` : ''}
      <div class="muted small" style="margin-top:6px">Updated ${new Date(t.updatedAt).toLocaleDateString()}</div>
    </a>`).join('') || (tunes.length ? '<p class="muted">No tunes match your search.</p>' : '');
}
$('#q').addEventListener('input', draw);
try { tunes = await api('tunes'); draw(); }
catch (e) { $('#list').innerHTML = `<p class="error">Could not load the library: ${esc(e.message)}</p>`; }
</script>
</body>
</html>
