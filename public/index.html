<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny Whistle Tabs</title>
<script>try{if(localStorage.getItem('pw-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="top"></div>
<main>
  <div class="lib-head">
    <div>
      <h1>Tune library</h1>
      <p class="muted" style="margin:0">Your approved penny whistle (D) tabs, and your <a href="friends.html">friends’</a> tunes.</p>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="Search title, key, chord…" aria-label="Search tunes">
      <a class="btn primary" href="editor.html">+ New tab from sheet music</a>
    </div>
  </div>
  <div id="list" aria-live="polite"></div>
  <div id="empty" class="card empty" hidden>
    <h2>No tunes yet</h2>
    <p class="muted">Upload a PDF or photo of sheet music and Claude will turn it into penny whistle tab with guitar chords.</p>
    <a class="btn primary" href="editor.html">Create your first tab</a>
  </div>
</main>
<script type="module">
import { $, api, esc, errorHTML, topbar, tuneHref } from './js/ui.js';
$('#top').innerHTML = topbar('library');
let lib = { mine: [], friends: [] };

const row = (t, owner) => {
  const href = esc(tuneHref(t.id, owner));
  return `
      <tr data-href="${href}">
        <td><a href="${href}">${esc(t.title)}</a>${t.composer ? `<div class="muted small">${esc(t.composer)}</div>` : ''}</td>
        <td>${t.key ? esc(t.key) : ''}</td>
        <td class="wide-only">${t.meter ? esc(t.meter) : ''}</td>
        <td class="num">${t.measures}</td>
        <td class="wide-only muted small">${(t.chords || []).map(esc).join(' · ')}</td>
        <td class="wide-only muted small">${new Date(t.updatedAt).toLocaleDateString()}</td>
      </tr>`;
};

// Alphabetical, ignoring case and accents, with "Reel 2" before "Reel 10".
const byTitle = (a, b) => (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base', numeric: true });
const friendName = (f) => f.name || f.email || '';

// Searching covers every tune you can see; a friend's name or email finds all their tunes.
const matches = (q, t, owner = {}) => !q || [t.title, t.composer, t.key, t.meter, ...(t.chords || []), owner.name, owner.email]
  .join(' ').toLowerCase().includes(q);

function section(heading, tunes, emptyText, q) {
  if (q && !tunes.length) return '';
  return `<section class="lib-section"><h2>${heading}</h2>
    ${tunes.length ? `<div class="tune-table-wrap"><table class="tune-table">
      <thead><tr><th>Title</th><th>Key</th><th class="wide-only">Meter</th><th class="num">Bars</th><th class="wide-only">Chords</th><th class="wide-only">Updated</th></tr></thead>
      <tbody>${tunes.join('')}</tbody></table></div>` : `<p class="muted">${emptyText}</p>`}</section>`;
}

function draw() {
  const q = $('#q').value.trim().toLowerCase();
  const total = lib.mine.length + lib.friends.reduce((n, f) => n + f.tunes.length, 0);
  const empty = !lib.mine.length && !lib.friends.length;
  $('#empty').hidden = !empty;
  if (empty) { $('#list').innerHTML = ''; return; }
  const mine = lib.mine.filter((t) => matches(q, t)).sort(byTitle).map((t) => row(t));
  let html = section('Your tunes', mine, 'You haven’t saved any tunes yet. <a href="editor.html">Create your first tab</a>.', q);
  for (const f of [...lib.friends].sort((a, b) => friendName(a).localeCompare(friendName(b), undefined, { sensitivity: 'base' }))) {
    const shown = f.tunes.filter((t) => matches(q, t, f)).sort(byTitle).map((t) => row(t, f.sub));
    const heading = f.name && f.name !== f.email
      ? `${esc(f.name)} <span class="muted small">${esc(f.email)}</span>` : esc(f.email);
    html += section(heading, shown, 'No tunes yet.', q);
  }
  $('#list').innerHTML = html || (total ? '<p class="muted">No tunes match your search.</p>' : '');
}
$('#q').addEventListener('input', draw);
// The whole row opens the tune; the title link keeps it keyboard- and middle-click-friendly.
$('#list').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a') && !getSelection().toString()) location.href = tr.dataset.href;
});
try { lib = await api('library'); draw(); }
catch (e) { $('#list').innerHTML = `<p>${errorHTML(e, 'Could not load the library')}</p>`; }
</script>
</body>
</html>
